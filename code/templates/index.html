<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNIST 数字识别</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .canvas-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        canvas {
            border: 3px dashed #ddd;
            border-radius: 10px;
            background: white;
            cursor: crosshair;
        }
        
        canvas:hover {
            border-color: #667eea;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .btn-predict {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-clear {
            background: #f0f0f0;
            color: #666;
        }
        
        .btn-clear:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        
        .result {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            margin-top: 20px;
        }
        
        .result h2 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .digit {
            font-size: 6em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        
        .confidence {
            font-size: 1.2em;
            color: #666;
        }
        
        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔢 MNIST 数字识别</h1>
        
        <p style="text-align: center; color: #666; margin-bottom: 20px;">
            在下方画布上绘制一个数字 (0-9)，然后点击识别按钮
        </p>
        
        <div class="canvas-container">
            <canvas id="canvas" width="280" height="280"></canvas>
        </div>
        
        <div class="buttons">
            <button class="btn-clear" onclick="clearCanvas()">清除画布</button>
            <button class="btn-predict" onclick="predictDigit()">识别数字</button>
        </div>
        
        <div id="loader" class="loader"></div>
        
        <div id="result" class="result" style="display: none;">
            <h2>识别结果</h2>
            <div class="digit" id="prediction">?</div>
            <div class="confidence" id="confidence">置信度: 0%</div>
        </div>
    </div>
    
    <div class="footer">
        <p>基于 CNN 的 MNIST 数字识别 | 准确率 99%+</p>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        
        ctx.fillStyle = '#000';
        ctx.lineWidth = 15;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.beginPath();
            ctx.moveTo(x, y);
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                ctx.lineTo(x, y);
                ctx.stroke();
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
        });
        
        canvas.addEventListener('mouseleave', () => {
            isDrawing = false;
        });
        
        function clearCanvas() {
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000';
            document.getElementById('result').style.display = 'none';
        }
        
        function predictDigit() {
            const loader = document.getElementById('loader');
            const result = document.getElementById('result');
            
            loader.style.display = 'block';
            result.style.display = 'none';
            
            const imageData = canvas.toDataURL('image/png');
            
            fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ image: imageData })
            })
            .then(response => response.json())
            .then(data => {
                loader.style.display = 'none';
                
                if (data.error) {
                    alert('识别失败: ' + data.error);
                    return;
                }
                
                document.getElementById('prediction').textContent = data.digit;
                document.getElementById('confidence').textContent = '置信度: ' + data.confidence + '%';
                result.style.display = 'block';
            })
            .catch(error => {
                loader.style.display = 'none';
                alert('网络错误: ' + error.message);
            });
        }
        
        clearCanvas();
    </script>
</body>
</html>
